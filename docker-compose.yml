services:
  postgres:
    image: postgres:16-alpine
    container_name: hotelaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hotelaria}
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - hotelaria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotelaria-pgdata:
