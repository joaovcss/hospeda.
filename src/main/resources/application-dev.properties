# Perfil de desenvolvimento: ative com SPRING_PROFILES_ACTIVE=dev
# As credenciais continuam vindo de variáveis de ambiente / .env.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.hotelaria=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# No perfil dev o bootstrap do administrador fica habilitado por padrão,
# mas ainda exige APP_BOOTSTRAP_ADMIN_EMAIL e APP_BOOTSTRAP_ADMIN_PASSWORD.
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
