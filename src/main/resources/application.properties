spring.application.name=hotelaria-backend

# O Render informa a porta pela variável PORT
server.port=${PORT:8080}

# Permite manter as variáveis em um arquivo .env local (não versionado)
spring.config.import=optional:file:.env[.properties]

# ---------- Banco de dados ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotelaria}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# O esquema é gerenciado exclusivamente pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carrega relacionamentos LAZY em lotes, evitando o problema N+1 nas listagens
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.jwt.issuer=hotelaria-backend

# ---------- CORS (origens do futuro frontend) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Hotel ----------
app.hotel.time-zone=${HOTEL_TIME_ZONE:America/Sao_Paulo}

# ---------- Bootstrap do primeiro administrador ----------
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Erros: nunca expor detalhes internos ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=false
